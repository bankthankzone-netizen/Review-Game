<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game System List - Game Review Hub</title>
    <!-- ฟอนต์สไตล์เกมมิ่งยุคเรโทร -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; font-family: 'Prompt', sans-serif; }
        
        body { 
            margin: 0; 
            background-color: #0b0f19; 
            color: #f8fafc; 
            padding: 30px 20px;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(56, 189, 248, 0.15), transparent 70%),
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 30px 30px, 30px 30px;
            background-attachment: fixed;
        }

        .container { max-width: 1280px; margin: 0 auto; }
        
        h1 { 
            text-align: center; 
            font-family: 'Press Start 2P', cursive;
            font-size: 2.2rem;
            color: #38bdf8; 
            margin-bottom: 40px; 
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.6), 0 0 20px rgba(56, 189, 248, 0.3);
            letter-spacing: 1px;
            line-height: 1.5;
        }

        /* Layout แบ่งเป็น Main Content และ Sidebar ด้านขวา */
        .main-layout {
            display: flex;
            gap: 25px;
            align-items: flex-start;
        }

        .content-area {
            flex: 1;
            min-width: 0;
        }

        /* Sidebar แถบอัปเดตล่าสุดด้านขวา */
        .sidebar {
            width: 320px;
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid rgba(56, 189, 248, 0.3);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            position: sticky;
            top: 20px;
            flex-shrink: 0;
        }

        .sidebar-title {
            color: #38bdf8;
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 18px;
            border-bottom: 2px solid rgba(56, 189, 248, 0.3);
            padding-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .new-badge-icon {
            background: #f43f5e;
            color: #fff;
            font-size: 10px;
            font-weight: bold;
            padding: 2px 8px;
            border-radius: 10px;
            font-family: 'Press Start 2P', cursive;
            animation: pulse 1.5s infinite;
        }

        .recent-card {
            display: flex;
            gap: 12px;
            padding: 10px;
            border-radius: 8px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid #334155;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .recent-card:hover {
            border-color: #38bdf8;
            transform: translateX(4px);
            background: rgba(56, 189, 248, 0.1);
        }

        .recent-thumb {
            width: 75px;
            height: 55px;
            object-fit: cover;
            border-radius: 6px;
            border: 1px solid #38bdf8;
            flex-shrink: 0;
        }

        .recent-info h4 {
            margin: 0 0 4px 0;
            color: #f8fafc;
            font-size: 15px;
            font-weight: 600;
        }

        .recent-meta {
            font-size: 12px;
            color: #94a3b8;
            display: flex;
            gap: 8px;
            align-items: center;
        }

        /* Responsive สำหรับมือถือ */
        @media (max-width: 900px) {
            .main-layout { flex-direction: column; }
            .sidebar { width: 100%; position: static; }
        }

        /* 1. หน้าหลัก (Gen List) */
        .gen-section { 
            background: rgba(30, 41, 59, 0.7); 
            backdrop-filter: blur(10px);
            border-radius: 12px; 
            padding: 22px; 
            margin-bottom: 25px; 
            border: 1px solid rgba(56, 189, 248, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .gen-title { 
            color: #f43f5e; 
            font-size: 1.3rem; 
            font-weight: 600; 
            margin-bottom: 16px; 
            border-bottom: 2px solid rgba(244, 63, 94, 0.3); 
            padding-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .gen-title::before { content: "🎮"; font-size: 1.1rem; }

        .console-list { display: flex; flex-wrap: wrap; gap: 12px; }
        .console-btn { 
            background: #0f172a; color: #e2e8f0; border: 1px solid #334155; 
            padding: 10px 20px; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: 500;
            transition: all 0.2s ease-in-out;
        }
        .console-btn:hover { 
            background: #38bdf8; color: #0f172a; font-weight: bold; border-color: #38bdf8;
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.8); transform: translateY(-2px);
        }

        /* ปุ่มย้อนกลับ */
        .back-btn { 
            background: #f43f5e; color: #fff; border: none; padding: 12px 24px; 
            border-radius: 6px; cursor: pointer; margin-bottom: 25px; font-weight: 600; font-size: 16px;
            box-shadow: 0 0 10px rgba(244, 63, 94, 0.4); transition: 0.2s;
        }
        .back-btn:hover { background: #e11d48; box-shadow: 0 0 15px rgba(244, 63, 94, 0.8); }

        /* 2. หน้าบทความ/รายชื่อเกม */
        #reviewPage, #detailPage { display: none; }

        .alphabet-filter { 
            display: flex; gap: 8px; flex-wrap: wrap; margin: 20px 0; 
            background: rgba(15, 23, 42, 0.8); padding: 14px; border-radius: 8px; border: 1px solid #334155;
        }
        .alpha-btn { 
            border: none; background: transparent; color: #38bdf8; font-weight: bold; 
            cursor: pointer; padding: 6px 12px; border-radius: 4px; transition: 0.2s; font-size: 15px;
        }
        .alpha-btn:hover { background: #38bdf8; color: #0f172a; }

        .game-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        
        .game-card-summary { 
            background: rgba(30, 41, 59, 0.8); border-radius: 12px; padding: 16px; 
            border: 1px solid #334155; display: flex; gap: 15px; cursor: pointer; transition: 0.2s;
            align-items: center;
        }
        .game-card-summary:hover {
            border-color: #38bdf8; transform: translateY(-3px); box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
        }
        
        .summary-cover { 
            width: 110px; 
            height: 85px; 
            object-fit: cover; 
            border-radius: 6px; 
            border: 1px solid #38bdf8; 
            flex-shrink: 0;
        }
        .summary-info { flex: 1; min-width: 0; }
        .summary-info h3 { margin: 0 0 5px 0; color: #38bdf8; font-size: 1.25rem; font-weight: 600; }
        .summary-info p { font-size: 14px; color: #94a3b8; margin: 6px 0 0 0; line-clamp: 2; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.5; }

        .genre-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
        .genre-tag { 
            background: rgba(56, 189, 248, 0.15); 
            color: #38bdf8; 
            border: 1px solid rgba(56, 189, 248, 0.4); 
            font-size: 12px; 
            padding: 3px 10px; 
            border-radius: 4px; 
            font-weight: 500;
        }

        /* 3. หน้าเนื้อหาเกมแบบเจาะลึก (Detail Page) */
        .detail-container {
            background: rgba(30, 41, 59, 0.9); border-radius: 12px; padding: 35px; border: 1px solid #334155;
        }
        .detail-header { display: flex; gap: 30px; flex-wrap: wrap; margin-bottom: 30px; border-bottom: 1px solid #475569; padding-bottom: 25px; align-items: center; }
        
        .detail-cover { 
            width: 280px; 
            height: 195px; 
            object-fit: cover; 
            border-radius: 8px; 
            border: 2px solid #38bdf8; 
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.4); 
            cursor: pointer;
            transition: transform 0.2s ease;
        }
        .detail-cover:hover { transform: scale(1.02); }

        .detail-meta { flex: 1; min-width: 260px; }
        .detail-title { font-size: 2.4rem; color: #f8fafc; margin: 0 0 12px 0; font-weight: 700; line-height: 1.2; }
        .score-badge { background: #f59e0b; color: #0f172a; padding: 6px 14px; border-radius: 6px; font-weight: bold; font-family: 'Press Start 2P', cursive; font-size: 1rem; display: inline-block; }
        
        .section-header { color: #f43f5e; font-size: 1.5rem; font-weight: 600; margin: 30px 0 12px 0; border-left: 5px solid #f43f5e; padding-left: 12px; letter-spacing: 0.5px; }
        .detail-text { font-size: 1.15rem; color: #e2e8f0; line-height: 1.9; font-weight: 400; }
        
        .screenshot-grid { display: flex; gap: 15px; margin-top: 18px; flex-wrap: wrap; }
        .screenshot-img { 
            width: 220px; 
            height: 145px; 
            object-fit: cover; 
            border-radius: 8px; 
            border: 1px solid #475569; 
            cursor: pointer;
            transition: transform 0.2s ease;
        }
        .screenshot-img:hover { transform: scale(1.03); border-color: #38bdf8; }

        /* Modal ภาพขยาย */
        .image-modal {
            display: none; position: fixed; z-index: 1000; left: 0; top: 0;
            width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.88);
            backdrop-filter: blur(5px); justify-content: center; align-items: center;
        }
        .modal-content { max-width: 90%; max-height: 85vh; border-radius: 10px; border: 2px solid #38bdf8; }
        .modal-close { position: absolute; top: 20px; right: 30px; color: #f8fafc; font-size: 40px; cursor: pointer; }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>GAME SYSTEM LIST</h1>

    <div class="main-layout">
        <!-- ฝั่งซ้าย: เนื้อหาหลัก -->
        <div class="content-area">
            
            <!-- 1. หน้าหลัก: รายชื่อเครื่องเกมตาม Gen -->
            <div id="homePage">
                <div id="genContainer"></div>
            </div>

            <!-- 2. หน้าแสดงรายชื่อเกมทั้งหมดตามตัวอักษร -->
            <div id="reviewPage">
                <button class="back-btn" onclick="goHome()">← Back to Systems</button>
                <h2 id="selectedConsoleTitle" style="color: #38bdf8; margin-top:0; font-size: 1.8rem;"></h2>
                <div class="alphabet-filter" id="alphabetButtons"></div>
                <div class="game-grid" id="gameList"></div>
            </div>

            <!-- 3. หน้ารายละเอียดเกมแบบเจาะลึก -->
            <div id="detailPage">
                <button class="back-btn" onclick="goBackToGameList()">← Back to Game List</button>
                <div class="detail-container" id="detailContent"></div>
            </div>

        </div>

        <!-- ฝั่งขวา: เมนูอัปเดตรีวิวเกมใหม่ล่าสุด (NEW REVIEWS) -->
        <div class="sidebar">
            <div class="sidebar-title">
                <span>NEW REVIEWS</span>
                <span class="new-badge-icon">NEW</span>
            </div>
            <div id="recentReviewsContainer"></div>
        </div>
    </div>
</div>

<!-- Modal สำหรับขยายภาพ -->
<div id="imageModal" class="image-modal" onclick="closeImageModal()">
    <span class="modal-close" onclick="closeImageModal()">&times;</span>
    <img id="modalImg" class="modal-content" src="" alt="Enlarged Image">
</div>

<script>
    const generations = [
        {
            title: "Active Platforms / Current Gen",
            consoles: [
                { id: "pc", name: "PC Gaming" },
                { id: "ps5", name: "PlayStation 5" },
                { id: "xboxsx", name: "Xbox Series X/S" },
                { id: "switch", name: "Nintendo Switch" }
            ]
        },
        {
            title: "Eighth Generation (2012-2019)",
            consoles: [
                { id: "ps4", name: "PlayStation 4" },
                { id: "xboxone", name: "Xbox One" },
                { id: "wiiu", name: "Wii U" },
                { id: "3ds", name: "Nintendo 3DS" },
                { id: "psvita", name: "PlayStation Vita" }
            ]
        },
        {
            title: "Seventh Generation (2005-2015)",
            consoles: [
                { id: "ps3", name: "PlayStation 3" },
                { id: "xbox360", name: "Xbox 360" },
                { id: "wii", name: "Wii" },
                { id: "ds", name: "Nintendo DS" },
                { id: "psp", name: "PSP" }
            ]
        },
        {
            title: "Sixth Generation (1998-2009)",
            consoles: [
                { id: "ps2", name: "PlayStation 2" },
                { id: "gamecube", name: "GameCube" },
                { id: "xbox", name: "Xbox" },
                { id: "dreamcast", name: "Dreamcast" },
                { id: "gba", name: "Game Boy Advance" }
            ]
        },
        {
            title: "Fifth Generation (1993-2001)",
            consoles: [
                { id: "ps1", name: "PlayStation" },
                { id: "n64", name: "Nintendo 64" },
                { id: "saturn", name: "Sega Saturn" },
                { id: "gbc", name: "Game Boy Color" }
            ]
        },
        {
            title: "Fourth Generation (1987-1995)",
            consoles: [
                { id: "sfc", name: "Super Nintendo (SFC)" },
                { id: "genesis", name: "Sega Genesis / Mega Drive" },
                { id: "gb", name: "Game Boy" }
            ]
        },
        {
            title: "Third Generation (1983-1990)",
            consoles: [
                { id: "fc", name: "NES / Famicom" },
                { id: "master", name: "Sega Master System" },
                { id: "atari7800", name: "Atari 7800" }
            ]
        },
        {
            title: "First & Second Generation (1972-1983)",
            consoles: [
                { id: "atari2600", name: "Atari 2600" },
                { id: "odyssey", name: "Magnavox Odyssey" }
            ]
        }
    ];

    // เพิ่มฟิลด์ date: "YYYY-MM-DD" เพื่อจัดเรียงการอัปเดตล่าสุด
    const games = [
        { 
            id: "contra-fc",
            consoleId: "fc",
            consoleName: "NES / Famicom", 
            name: "Contra", 
            score: "10/10",
            date: "2026-03-28",
            genres: ["Action", "Run and Gun"],
            cover: "https://i.postimg.cc/gJjyfS65/00.jpg",
            screenshots: [
                "https://i.postimg.cc/Zny8qWHH/01.jpg",
                "https://i.postimg.cc/h4J6mM32/02.jpg"
            ],
            summary: "สุดยอดเกมเดินยิงระดับตำนาน การต่อสู้ของ 2 ทหารกล้าถล่มกองทัพเอเลี่ยน!",
            story: "เรื่องราวเกิดขึ้นในปี ค.ศ. 2633 องค์กรก่อการร้ายต่างดาวในนาม 'Red Falcon' ได้แอบเข้ามายึดครองเกาะ Galuga ใกล้กับอเมริกาใต้ และตั้งฐานปฏิบัติการเพื่อเตรียมล้างเผ่าพันธุ์มนุษยชาติ กองกำลังทหารพิเศษ Earth Marine Corp จึงได้ส่งสองยอดหน่วยรบพิเศษ 'Contra' นามว่า Bill Rizer (Mad Dog) และ Lance Bean (Scorpion) เข้าสู่สมรภูมิเพื่อทำลายล้างพวกมันให้สิ้นซาก",
            lore: "คำว่า 'Contra' ในจักรวาลของเกม ไม่ได้หมายถึงชื่อตัวละคร แต่เป็น 'รหัสยศพิเศษ' ที่มอบให้กับทหารที่มีจิตวิญญาณแห่งการรบอันเหนือมนุษย์ มีความสามารถในการใช้อาวุธทุกรูปแบบ และสามารถเอาชีวิตรอดในสภาพแวดล้อมที่โหดร้ายที่สุดได้ ตัวละคร Bill และ Lance ได้รับแรงบันดาลใจด้านรูปร่างมาจากดารานักบู๊ฮอลลีวูดอย่าง Arnold Schwarzenegger และ Sylvester Stallone ในยุค 80s",
            gameplayReview: "เกมเพลย์เป็นแนว Action Side-Scrolling ที่ผสมผสานฉากการเล่นทั้งแบบมุมมองด้านข้างและมุมมอง 3D ด้านหลัง (ในฉากฐานทัพ) อาวุธที่มีให้เก็บหลากหลาย โดยเฉพาะ 'S' (Spread Gun) ที่ยิงกระสุนกระจายเป็นพัดซึ่งเป็นอาวุธยอดฮิต ตัวเกมมีความท้าทายสูงมาก พลาดโดนยิงครั้งเดียวเสียชีวิตทันที นำไปสู่สูตรกดในตำนาน Konami Code 'ขึ้น ขึ้น ลง ลง ซ้าย ขวา ซ้าย ขวา บี เอ' เพื่อเพิ่มชีวิตเป็น 30 ตัว",
            graphicsReview: "ในยุค 8-bit ถือว่าทำกราฟิกสไปรต์ตัวละครขยับได้ลื่นไหล ฉากหลังมีรายละเอียดดีเยี่ยม ตั้งแต่ป่าดงดิบไปจนถึงฐานทัพเอเลี่ยนชีวภาพที่ทำออกมาได้น่าตื่นตาตื่นใจมากในยุคนั้น",
            soundReview: "เพลงประกอบระดับขึ้นหิ้ง (Masterpiece) โดย Konami Kukeiha Club ดนตรี Synth-Rock ปลุกใจเร้าอารมณ์สุดๆ พร้อมเสียงเอฟเฟกต์ยิงปืนและระเบิดที่เป็นเอกลักษณ์จดจำง่าย"
        }
    ];

    let currentConsole = null;
    let currentLetter = 'all';

    function initGenerations() {
        const container = document.getElementById('genContainer');
        container.innerHTML = '';
        generations.forEach(gen => {
            const sec = document.createElement('div');
            sec.className = 'gen-section';
            
            let buttonsHtml = gen.consoles.map(c => 
                `<button class="console-btn" onclick="selectConsole('${c.id}', '${c.name}')">${c.name}</button>`
            ).join('');

            sec.innerHTML = `
                <div class="gen-title">${gen.title}</div>
                <div class="console-list">${buttonsHtml}</div>
            `;
            container.appendChild(sec);
        });
    }

    // แสดงการอัปเดตเกมล่าสุดใน Sidebar ด้านขวา
    function renderRecentReviews() {
        const container = document.getElementById('recentReviewsContainer');
        container.innerHTML = '';

        // เรียงจากเกมอัปเดตล่าสุด (แสดงสูงสุด 5 รายการ)
        const recentList = [...games].sort((a, b) => new Date(b.date) - new Date(a.date)).slice(0, 5);

        if (recentList.length === 0) {
            container.innerHTML = `<p style="color:#64748b; text-align:center; font-size:14px;">ยังไม่มีรีวิวใหม่</p>`;
            return;
        }

        recentList.forEach(game => {
            const card = document.createElement('div');
            card.className = 'recent-card';
            card.onclick = () => openGameDetail(game.id);

            card.innerHTML = `
                <img src="${game.cover}" class="recent-thumb" alt="${game.name}">
                <div class="recent-info">
                    <h4>${game.name}</h4>
                    <div class="recent-meta">
                        <span>🎮 ${game.consoleName || 'Retro'}</span>
                        <span style="color:#f59e0b;">★ ${game.score}</span>
                    </div>
                </div>
            `;
            container.appendChild(card);
        });
    }

    function selectConsole(consoleId, consoleName) {
        currentConsole = consoleId;
        currentLetter = 'all';
        document.getElementById('homePage').style.display = 'none';
        document.getElementById('reviewPage').style.display = 'block';
        document.getElementById('detailPage').style.display = 'none';
        document.getElementById('selectedConsoleTitle').innerText = `Games for ${consoleName}`;
        
        initAlphabet();
        renderGames();
    }

    function goHome() {
        document.getElementById('homePage').style.display = 'block';
        document.getElementById('reviewPage').style.display = 'none';
        document.getElementById('detailPage').style.display = 'none';
    }

    function goBackToGameList() {
        document.getElementById('homePage').style.display = 'none';
        document.getElementById('reviewPage').style.display = 'block';
        document.getElementById('detailPage').style.display = 'none';
    }

    function initAlphabet() {
        const container = document.getElementById('alphabetButtons');
        let html = `<button class="alpha-btn" onclick="filterLetter('all')">ALL</button>`;
        for (let i = 65; i <= 90; i++) {
            const letter = String.fromCharCode(i);
            html += `<button class="alpha-btn" onclick="filterLetter('${letter}')">${letter}</button>`;
        }
        container.innerHTML = html;
    }

    function filterLetter(letter) {
        currentLetter = letter;
        renderGames();
    }

    function renderGames() {
        const list = document.getElementById('gameList');
        list.innerHTML = '';

        const filtered = games.filter(game => {
            const matchConsole = game.consoleId === currentConsole;
            const firstLetter = game.name.charAt(0).toUpperCase();
            const matchLetter = (currentLetter === 'all') || (firstLetter === currentLetter);
            return matchConsole && matchLetter;
        });

        if (filtered.length === 0) {
            list.innerHTML = `<p style="grid-column: 1/-1; color: #64748b; text-align:center; padding: 40px 0; font-size: 1.1rem;">ยังไม่มีรีวิวเกมในหมวดนี้</p>`;
            return;
        }

        filtered.sort((a, b) => a.name.localeCompare(b.name));

        filtered.forEach(game => {
            const card = document.createElement('div');
            card.className = 'game-card-summary';
            card.onclick = () => openGameDetail(game.id);

            const genreTagsHtml = (game.genres || []).map(g => `<span class="genre-tag">${g}</span>`).join('');

            card.innerHTML = `
                <img src="${game.cover}" class="summary-cover" alt="${game.name}">
                <div class="summary-info">
                    <h3>${game.name}</h3>
                    <div style="color:#f59e0b; font-size:13px; font-weight:bold;">★ ${game.score}</div>
                    <div class="genre-tags">${genreTagsHtml}</div>
                    <p>${game.summary}</p>
                </div>
            `;
            list.appendChild(card);
        });
    }

    function openGameDetail(gameId) {
        const game = games.find(g => g.id === gameId);
        if(!game) return;

        document.getElementById('homePage').style.display = 'none';
        document.getElementById('reviewPage').style.display = 'none';
        document.getElementById('detailPage').style.display = 'block';

        let screenshotsHtml = '';
        if (game.screenshots && game.screenshots.length > 0) {
            screenshotsHtml = `
                <div class="section-header">GAMEPLAY SCREENSHOTS</div>
                <div class="screenshot-grid">
                    ${game.screenshots.map(src => `<img src="${src}" class="screenshot-img" alt="Gameplay" onclick="openImageModal('${src}')">`).join('')}
                </div>
            `;
        }

        const genreTagsHtml = (game.genres || []).map(g => `<span class="genre-tag" style="font-size:13px; padding:4px 12px;">${g}</span>`).join('');

        document.getElementById('detailContent').innerHTML = `
            <div class="detail-header">
                <img src="${game.cover}" class="detail-cover" alt="${game.name}" onclick="openImageModal('${game.cover}')" title="คลิกเพื่อขยายภาพ">
                <div class="detail-meta">
                    <h1 class="detail-title">${game.name}</h1>
                    <div style="margin-bottom: 14px;"><span class="score-badge">SCORE: ${game.score}</span></div>
                    <div class="genre-tags">${genreTagsHtml}</div>
                    <p class="detail-text" style="margin-top:16px;">${game.summary}</p>
                </div>
            </div>

            <div class="section-header">📖 STORY (เนื้อเรื่อง)</div>
            <p class="detail-text">${game.story}</p>

            <div class="section-header">🔮 LORE & TRIVIA (เบื้องหลังและตำนาน)</div>
            <p class="detail-text">${game.lore}</p>

            <div class="section-header">🎮 GAMEPLAY REVIEW (รีวิวระบบเกม)</div>
            <p class="detail-text">${game.gameplayReview}</p>

            <div class="section-header">🎨 GRAPHICS REVIEW (กราฟิก)</div>
            <p class="detail-text">${game.graphicsReview || 'N/A'}</p>

            <div class="section-header">🎵 SOUND & MUSIC REVIEW (ดนตรีและเสียงประกอบ)</div>
            <p class="detail-text">${game.soundReview || 'N/A'}</p>

            ${screenshotsHtml}
        `;
    }

    function openImageModal(imgSrc) {
        const modal = document.getElementById('imageModal');
        const modalImg = document.getElementById('modalImg');
        modalImg.src = imgSrc;
        modal.style.display = 'flex';
    }

    function closeImageModal() {
        document.getElementById('imageModal').style.display = 'none';
    }

    initGenerations();
    renderRecentReviews();
</script>

</body>
</html>
