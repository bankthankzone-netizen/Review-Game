<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game System List - Game Review Hub</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
        body { margin: 0; background-color: #0f172a; color: #f8fafc; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        
        h1 { text-align: center; color: #38bdf8; margin-bottom: 30px; }
        .gen-section { background: #1e293b; border-radius: 8px; padding: 15px 20px; margin-bottom: 20px; border-left: 4px solid #38bdf8; }
        .gen-title { color: #38bdf8; font-size: 1.2rem; font-weight: bold; margin-bottom: 12px; border-bottom: 1px solid #334155; padding-bottom: 5px; }
        
        .console-list { display: flex; flex-wrap: wrap; gap: 10px; }
        .console-btn { background: #334155; color: #f8fafc; border: none; padding: 8px 14px; border-radius: 5px; cursor: pointer; font-size: 14px; transition: 0.2s; }
        .console-btn:hover { background: #38bdf8; color: #0f172a; font-weight: bold; }

        /* หน้าแสดงรีวิวเกม */
        #reviewPage { display: none; }
        .back-btn { background: #334155; color: #fff; border: none; padding: 8px 16px; border-radius: 5px; cursor: pointer; margin-bottom: 20px; }
        .back-btn:hover { background: #38bdf8; color: #0f172a; }

        .alphabet-filter { display: flex; gap: 6px; flex-wrap: wrap; margin: 15px 0; background: #1e293b; padding: 10px; border-radius: 6px; }
        .alpha-btn { border: none; background: transparent; color: #38bdf8; font-weight: bold; cursor: pointer; padding: 4px 8px; }
        .alpha-btn:hover { color: #fff; text-decoration: underline; }

        .game-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; }
        .game-card { background: #1e293b; border-radius: 8px; padding: 15px; border-left: 4px solid #38bdf8; }
        .game-card h3 { margin: 0 0 8px 0; color: #f8fafc; }
        .game-card p { font-size: 14px; color: #94a3b8; margin: 0; }
    </style>
</head>
<body>

<div class="container">

    <!-- หน้าหลัก: รายชื่อเครื่องเกมตาม Gen -->
    <div id="homePage">
        <h1>🎮 Game System List</h1>
        <div id="genContainer"></div>
    </div>

    <!-- หน้าแสดงบทความรีวิว -->
    <div id="reviewPage">
        <button class="back-btn" onclick="goHome()">← กลับไปเลือกเครื่องเกม</button>
        <h2 id="selectedConsoleTitle" style="color: #38bdf8; margin-top:0;"></h2>
        <div class="alphabet-filter" id="alphabetButtons"></div>
        <div class="game-grid" id="gameList"></div>
    </div>

</div>

<script>
    // แยกหมวดหมู่ตาม Generation
    const generations = [
        {
            title: "Active Platforms / Current Gen",
            consoles: [
                { id: "pc", name: "PC" },
                { id: "ps5", name: "PlayStation 5" },
                { id: "xboxsx", name: "Xbox Series X/S" },
                { id: "switch", name: "Nintendo Switch" }
            ]
        },
        {
            title: "Eighth Generation (2012-2019)",
            consoles: [
                { id: "ps4", name: "PlayStation 4" },
                { id: "xboxone", name: "Xbox One" },
                { id: "wiiu", name: "Wii U" },
                { id: "3ds", name: "Nintendo 3DS" },
                { id: "psvita", name: "PlayStation Vita" }
            ]
        },
        {
            title: "Seventh Generation (2005-2015)",
            consoles: [
                { id: "ps3", name: "PlayStation 3" },
                { id: "xbox360", name: "Xbox 360" },
                { id: "wii", name: "Wii" },
                { id: "ds", name: "Nintendo DS" },
                { id: "psp", name: "PSP" }
            ]
        },
        {
            title: "Sixth Generation (1998-2009)",
            consoles: [
                { id: "ps2", name: "PlayStation 2" },
                { id: "gamecube", name: "GameCube" },
                { id: "xbox", name: "Xbox" },
                { id: "dreamcast", name: "Dreamcast" },
                { id: "gba", name: "Game Boy Advance" }
            ]
        },
        {
            title: "Fifth Generation (1993-2001)",
            consoles: [
                { id: "ps1", name: "PlayStation" },
                { id: "n64", name: "Nintendo 64" },
                { id: "saturn", name: "Sega Saturn" },
                { id: "gbc", name: "Game Boy Color" }
            ]
        },
        {
            title: "Fourth Generation (1987-1995)",
            consoles: [
                { id: "sfc", name: "Super Nintendo (SFC)" },
                { id: "genesis", name: "Sega Genesis / Mega Drive" },
                { id: "gb", name: "Game Boy" }
            ]
        },
        {
            title: "Third Generation (1983-1990)",
            consoles: [
                { id: "fc", name: "NES / Famicom" },
                { id: "master", name: "Sega Master System" },
                { id: "atari7800", name: "Atari 7800" }
            ]
        },
        {
            title: "First & Second Generation (1972-1983)",
            consoles: [
                { id: "atari2600", name: "Atari 2600" },
                { id: "odyssey", name: "Magnavox Odyssey" }
            ]
        }
    ];

    // ฐานข้อมูลเกม
    const games = [
        { consoleId: "fc", name: "Contra", review: "เกมเดินยิงในตำนาน กดสูตร 30 ตัวขึ้นขึ้นลงลงซ้ายขวาซ้ายขวาบีเอ" },
        { consoleId: "fc", name: "Super Mario Bros.", review: "จุดเริ่มต้นของลุงหนวดช่างประปา กราฟิกและดนตรีเป็นเอกลักษณ์" },
        { consoleId: "sfc", name: "Chrono Trigger", review: "หนึ่งใน RPG ที่ดีที่สุดตลอดกาล ระบบข้ามเวลาและฉากจบหลากหลาย" },
        { consoleId: "ps1", name: "Castlevania: Symphony of the Night", review: "ต้นตำรับแนว Metroidvania ระบบสำรวจปราสาทสุดลึกซึ้ง" },
        { consoleId: "ps2", name: "Grand Theft Auto: San Andreas", review: "โลกเปิดระดับตำนาน อิสระในการเล่นสูงมาก" },
        { consoleId: "switch", name: "Zelda: Breath of the Wild", review: "เปิดโลกการผจญภัยแบบอิสระไร้ขีดจำกัด" },
        { consoleId: "ps5", name: "God of War Ragnarök", review: "ภาพสวยจัดเต็ม การต่อสู้ดุดัน เนื้อเรื่องเข้มข้น" }
    ];

    let currentConsole = null;
    let currentLetter = 'all';

    function initGenerations() {
        const container = document.getElementById('genContainer');
        container.innerHTML = '';
        generations.forEach(gen => {
            const sec = document.createElement('div');
            sec.className = 'gen-section';
            
            let buttonsHtml = gen.consoles.map(c => 
                `<button class="console-btn" onclick="selectConsole('${c.id}', '${c.name}')">${c.name}</button>`
            ).join('');

            sec.innerHTML = `
                <div class="gen-title">${gen.title}</div>
                <div class="console-list">${buttonsHtml}</div>
            `;
            container.appendChild(sec);
        });
    }

    function selectConsole(consoleId, consoleName) {
        currentConsole = consoleId;
        currentLetter = 'all';
        document.getElementById('homePage').style.display = 'none';
        document.getElementById('reviewPage').style.display = 'block';
        document.getElementById('selectedConsoleTitle').innerText = `รายชื่อเกม: ${consoleName}`;
        
        initAlphabet();
        renderGames();
    }

    function goHome() {
        document.getElementById('homePage').style.display = 'block';
        document.getElementById('reviewPage').style.display = 'none';
    }

    function initAlphabet() {
        const container = document.getElementById('alphabetButtons');
        let html = `<button class="alpha-btn" onclick="filterLetter('all')">ทั้งหมด</button>`;
        for (let i = 65; i <= 90; i++) {
            const letter = String.fromCharCode(i);
            html += `<button class="alpha-btn" onclick="filterLetter('${letter}')">${letter}</button>`;
        }
        container.innerHTML = html;
    }

    function filterLetter(letter) {
        currentLetter = letter;
        renderGames();
    }

    function renderGames() {
        const list = document.getElementById('gameList');
        list.innerHTML = '';

        const filtered = games.filter(game => {
            const matchConsole = game.consoleId === currentConsole;
            const firstLetter = game.name.charAt(0).toUpperCase();
            const matchLetter = (currentLetter === 'all') || (firstLetter === currentLetter);
            return matchConsole && matchLetter;
        });

        if (filtered.length === 0) {
            list.innerHTML = `<p style="grid-column: 1/-1; color: #64748b; text-align:center;">ยังไม่มีรีวิวเกมในหมวดนี้</p>`;
            return;
        }

        filtered.sort((a, b) => a.name.localeCompare(b.name));

        filtered.forEach(game => {
            const card = document.createElement('div');
            card.className = 'game-card';
            card.innerHTML = `
                <h3>${game.name}</h3>
                <p>${game.review}</p>
            `;
            list.appendChild(card);
        });
    }

    initGenerations();
</script>

</body>
</html>
