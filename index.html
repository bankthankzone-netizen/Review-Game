<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Review Hub</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { margin: 0; background-color: #0f172a; color: #f8fafc; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        h1 { text-align: center; color: #38bdf8; }
        
        /* เมนูเลือกเครื่องเกม */
        .platform-tabs { display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; flex-wrap: wrap; }
        .tab-btn { padding: 10px 20px; border: none; background: #1e293b; color: #94a3b8; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; transition: 0.3s; }
        .tab-btn.active, .tab-btn:hover { background: #38bdf8; color: #0f172a; }

        /* เมนูหมวดตัวอักษร A-Z */
        .alphabet-filter { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 25px; background: #1e293b; padding: 15px; border-radius: 8px; }
        .alpha-btn { border: none; background: transparent; color: #38bdf8; font-weight: bold; cursor: pointer; padding: 4px 8px; font-size: 16px; }
        .alpha-btn:hover { color: #fff; text-decoration: underline; }

        /* การ์ดแสดงผลเกม */
        .game-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 15px; }
        .game-card { background: #1e293b; border-radius: 8px; padding: 15px; border-left: 4px solid #38bdf8; }
        .game-card h3 { margin: 0 0 8px 0; color: #f8fafc; }
        .game-card .letter-badge { background: #334155; color: #38bdf8; padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .game-card p { font-size: 14px; color: #94a3b8; margin: 10px 0 0 0; }
    </style>
</head>
<body>

<div class="container">
    <h1>🎮 Game Review Hub</h1>

    <!-- 1. เลือกเครื่องเกม -->
    <div class="platform-tabs">
        <button class="tab-btn active" onclick="filterPlatform('all', this)">ทั้งหมด</button>
        <button class="tab-btn" onclick="filterPlatform('PC', this)">PC</button>
        <button class="tab-btn" onclick="filterPlatform('PS5', this)">PS5</button>
        <button class="tab-btn" onclick="filterPlatform('Switch', this)">Switch</button>
    </div>

    <!-- 2. ปุ่มคัดกรองตัวอักษร A-Z -->
    <div class="alphabet-filter" id="alphabetButtons"></div>

    <!-- 3. รายชื่อเกม -->
    <div class="game-grid" id="gameList"></div>
</div>

<script>
    // ฐานข้อมูลเกม (เพิ่ม/แก้ไข รายชื่อเกมตรงนี้ได้เลย)
    const games = [
        { name: "Apex Legends", platform: "PC", review: "เกมยิง Battle Royale ทำความเร็วสูง สนุกมากเมื่อเล่นกับเพื่อน" },
        { name: "Black Myth: Wukong", platform: "PC", review: "แอ็กชันคุณภาพสูง กราฟิกอลังการ ถ่ายทอดตำนานไซอิ๋วได้ยอดเยี่ยม" },
        { name: "Cyberpunk 2077", platform: "PC", review: "โลกเปิดสไตล์ไซเบอร์พังก์ เนื้อเรื่องเข้มข้น มิติเมืองทำออกมาได้ดี" },
        { name: "Elden Ring", platform: "PS5", review: "สุดยอดเกม Action RPG โลกเปิดที่ท้าทายและงานออกแบบยอดเยี่ยม" },
        { name: "God of War Ragnarök", platform: "PS5", review: "การเดินทางของเครโทสและอเทรอุส การต่อสู้ดุดัน เนื้อเรื่องซาบซึ้ง" },
        { name: "GTA V", platform: "PC", review: "เกมระดับขึ้นหิ้ง โลกเปิดกว้างขวาง อิสระในการเล่นสูง" },
        { name: "Mario Odyssey", platform: "Switch", review: "เกมแพลตฟอร์มเมอร์ความคิดสร้างสรรค์สูง เล่นเพลินได้ทุกวัย" },
        { name: "Zelda: Tears of the Kingdom", platform: "Switch", review: "การผจญภัยสุดยิ่งใหญ่ ระบบสร้างของอิสระเหนือจินตนาการ" }
    ];

    let currentPlatform = 'all';
    let currentLetter = 'all';

    // สร้างปุ่ม A-Z อัตโนมัติ
    function initAlphabet() {
        const container = document.getElementById('alphabetButtons');
        let html = `<button class="alpha-btn" onclick="filterLetter('all')">ทั้งหมด</button>`;
        for (let i = 65; i <= 90; i++) {
            const letter = String.fromCharCode(i);
            html += `<button class="alpha-btn" onclick="filterLetter('${letter}')">${letter}</button>`;
        }
        container.innerHTML = html;
    }

    // ฟังก์ชันแสดงผลเกม
    function renderGames() {
        const list = document.getElementById('gameList');
        list.innerHTML = '';

        const filtered = games.filter(game => {
            const matchPlatform = (currentPlatform === 'all') || (game.platform === currentPlatform);
            const firstLetter = game.name.charAt(0).toUpperCase();
            const matchLetter = (currentLetter === 'all') || (firstLetter === currentLetter);
            return matchPlatform && matchLetter;
        });

        if (filtered.length === 0) {
            list.innerHTML = `<p style="text-align:center; grid-column: 1/-1; color: #64748b;">ไม่พบข้อมูลเกม</p>`;
            return;
        }

        // เรียงลำดับชื่อเกมตามตัวอักษร A-Z
        filtered.sort((a, b) => a.name.localeCompare(b.name));

        filtered.forEach(game => {
            const card = document.createElement('div');
            card.className = 'game-card';
            card.innerHTML = `
                <span class="letter-badge">${game.platform}</span>
                <h3 style="margin-top:8px;">${game.name}</h3>
                <p>${game.review}</p>
            `;
            list.appendChild(card);
        });
    }

    function filterPlatform(platform, btn) {
        currentPlatform = platform;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderGames();
    }

    function filterLetter(letter) {
        currentLetter = letter;
        renderGames();
    }

    // เริ่มทำงานเมื่อโหลดหน้า
    initAlphabet();
    renderGames();
</script>

</body>
</html>
