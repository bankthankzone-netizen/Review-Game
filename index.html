<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game System List - Game Review Hub</title>
    <!-- ฟอนต์สไตล์เกมมิ่งยุคเรโทร -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; font-family: 'Prompt', sans-serif; }
        
        body { 
            margin: 0; 
            background-color: #0b0f19; 
            color: #f8fafc; 
            padding: 30px 20px;
            /* ฉากหลังลายตาราง Grid สไตล์ไซเบอร์และพิกเซล */
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(56, 189, 248, 0.15), transparent 70%),
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 30px 30px, 30px 30px;
            background-attachment: fixed;
        }

        .container { max-width: 1000px; margin: 0 auto; }
        
        /* หัวข้อเว็บสไตล์เรโทรพิกเซล */
        h1 { 
            text-align: center; 
            font-family: 'Press Start 2P', cursive;
            font-size: 1.8rem;
            color: #38bdf8; 
            margin-bottom: 35px; 
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.6), 0 0 20px rgba(56, 189, 248, 0.3);
            letter-spacing: 1px;
            line-height: 1.4;
        }

        /* กล่องหมวด Gen สไตล์การ์ดเกมมิ่ง */
        .gen-section { 
            background: rgba(30, 41, 59, 0.7); 
            backdrop-filter: blur(10px);
            border-radius: 12px; 
            padding: 20px; 
            margin-bottom: 25px; 
            border: 1px solid rgba(56, 189, 248, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .gen-title { 
            color: #f43f5e; 
            font-size: 1.1rem; 
            font-weight: 600; 
            margin-bottom: 15px; 
            border-bottom: 2px solid rgba(244, 63, 94, 0.3); 
            padding-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .gen-title::before {
            content: "🎮";
            font-size: 0.9rem;
        }

        /* ปุ่มเลือกเครื่องเกมทรงแคปซูลนีออน */
        .console-list { display: flex; flex-wrap: wrap; gap: 10px; }
        
        .console-btn { 
            background: #0f172a; 
            color: #e2e8f0; 
            border: 1px solid #334155; 
            padding: 9px 18px; 
            border-radius: 6px; 
            cursor: pointer; 
            font-size: 14px; 
            transition: all 0.2s ease-in-out;
        }

        .console-btn:hover { 
            background: #38bdf8; 
            color: #0f172a; 
            font-weight: bold;
            border-color: #38bdf8;
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.8);
            transform: translateY(-2px);
        }

        /* หน้าแสดงรีวิวเกม */
        #reviewPage { display: none; }
        
        .back-btn { 
            background: #f43f5e; 
            color: #fff; 
            border: none; 
            padding: 10px 20px; 
            border-radius: 6px; 
            cursor: pointer; 
            margin-bottom: 25px;
            font-weight: 600;
            box-shadow: 0 0 10px rgba(244, 63, 94, 0.4);
            transition: 0.2s;
        }

        .back-btn:hover { 
            background: #e11d48;
            box-shadow: 0 0 15px rgba(244, 63, 94, 0.8);
        }

        /* เมนูหมวดตัวอักษร A-Z */
        .alphabet-filter { 
            display: flex; 
            gap: 6px; 
            flex-wrap: wrap; 
            margin: 20px 0; 
            background: rgba(15, 23, 42, 0.8); 
            padding: 12px; 
            border-radius: 8px;
            border: 1px solid #334155;
        }

        .alpha-btn { 
            border: none; 
            background: transparent; 
            color: #38bdf8; 
            font-weight: bold; 
            cursor: pointer; 
            padding: 5px 10px; 
            border-radius: 4px;
            transition: 0.2s;
        }

        .alpha-btn:hover { 
            background: #38bdf8; 
            color: #0f172a; 
        }

        /* การ์ดบทความเกม */
        .game-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 18px; }
        
        .game-card { 
            background: rgba(30, 41, 59, 0.8); 
            border-radius: 10px; 
            padding: 20px; 
            border: 1px solid #334155;
            position: relative;
            overflow: hidden;
        }

        .game-card::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 4px; height: 100%;
            background: #38bdf8;
            box-shadow: 0 0 8px #38bdf8;
        }

        .game-card h3 { margin: 0 0 10px 0; color: #f8fafc; font-size: 1.1rem; }
        .game-card p { font-size: 14px; color: #94a3b8; margin: 0; line-height: 1.5; }
    </style>
</head>
<body>

<div class="container">

    <!-- หน้าหลัก: รายชื่อเครื่องเกมตาม Gen -->
    <div id="homePage">
        <h1>GAME SYSTEM LIST</h1>
        <div id="genContainer"></div>
    </div>

    <!-- หน้าแสดงบทความรีวิว -->
    <div id="reviewPage">
        <button class="back-btn" onclick="goHome()">← Back to Systems</button>
        <h2 id="selectedConsoleTitle" style="color: #38bdf8; margin-top:0;"></h2>
        <div class="alphabet-filter" id="alphabetButtons"></div>
        <div class="game-grid" id="gameList"></div>
    </div>

</div>

<script>
    const generations = [
        {
            title: "Active Platforms / Current Gen",
            consoles: [
                { id: "pc", name: "PC Gaming" },
                { id: "ps5", name: "PlayStation 5" },
                { id: "xboxsx", name: "Xbox Series X/S" },
                { id: "switch", name: "Nintendo Switch" }
            ]
        },
        {
            title: "Eighth Generation (2012-2019)",
            consoles: [
                { id: "ps4", name: "PlayStation 4" },
                { id: "xboxone", name: "Xbox One" },
                { id: "wiiu", name: "Wii U" },
                { id: "3ds", name: "Nintendo 3DS" },
                { id: "psvita", name: "PlayStation Vita" }
            ]
        },
        {
            title: "Seventh Generation (2005-2015)",
            consoles: [
                { id: "ps3", name: "PlayStation 3" },
                { id: "xbox360", name: "Xbox 360" },
                { id: "wii", name: "Wii" },
                { id: "ds", name: "Nintendo DS" },
                { id: "psp", name: "PSP" }
            ]
        },
        {
            title: "Sixth Generation (1998-2009)",
            consoles: [
                { id: "ps2", name: "PlayStation 2" },
                { id: "gamecube", name: "GameCube" },
                { id: "xbox", name: "Xbox" },
                { id: "dreamcast", name: "Dreamcast" },
                { id: "gba", name: "Game Boy Advance" }
            ]
        },
        {
            title: "Fifth Generation (1993-2001)",
            consoles: [
                { id: "ps1", name: "PlayStation" },
                { id: "n64", name: "Nintendo 64" },
                { id: "saturn", name: "Sega Saturn" },
                { id: "gbc", name: "Game Boy Color" }
            ]
        },
        {
            title: "Fourth Generation (1987-1995)",
            consoles: [
                { id: "sfc", name: "Super Nintendo (SFC)" },
                { id: "genesis", name: "Sega Genesis / Mega Drive" },
                { id: "gb", name: "Game Boy" }
            ]
        },
        {
            title: "Third Generation (1983-1990)",
            consoles: [
                { id: "fc", name: "NES / Famicom" },
                { id: "master", name: "Sega Master System" },
                { id: "atari7800", name: "Atari 7800" }
            ]
        },
        {
            title: "First & Second Generation (1972-1983)",
            consoles: [
                { id: "atari2600", name: "Atari 2600" },
                { id: "odyssey", name: "Magnavox Odyssey" }
            ]
        }
    ];

    const games = [
        { consoleId: "fc", name: "Contra", review: "เกมเดินยิงในตำนาน กดสูตร 30 ตัวขึ้นขึ้นลงลงซ้ายขวาซ้ายขวาบีเอ" },
        { consoleId: "fc", name: "Super Mario Bros.", review: "จุดเริ่มต้นของลุงหนวดช่างประปา กราฟิกและดนตรีเป็นเอกลักษณ์" },
        { consoleId: "sfc", name: "Chrono Trigger", review: "หนึ่งใน RPG ที่ดีที่สุดตลอดกาล ระบบข้ามเวลาและฉากจบหลากหลาย" },
        { consoleId: "ps1", name: "Castlevania: Symphony of the Night", review: "ต้นตำรับแนว Metroidvania ระบบสำรวจปราสาทสุดลึกซึ้ง" },
        { consoleId: "ps2", name: "Grand Theft Auto: San Andreas", review: "โลกเปิดระดับตำนาน อิสระในการเล่นสูงมาก" },
        { consoleId: "switch", name: "Zelda: Breath of the Wild", review: "เปิดโลกการผจญภัยแบบอิสระไร้ขีดจำกัด" },
        { consoleId: "ps5", name: "God of War Ragnarök", review: "ภาพสวยจัดเต็ม การต่อสู้ดุดัน เนื้อเรื่องเข้มข้น" }
    ];

    let currentConsole = null;
    let currentLetter = 'all';

    function initGenerations() {
        const container = document.getElementById('genContainer');
        container.innerHTML = '';
        generations.forEach(gen => {
            const sec = document.createElement('div');
            sec.className = 'gen-section';
            
            let buttonsHtml = gen.consoles.map(c => 
                `<button class="console-btn" onclick="selectConsole('${c.id}', '${c.name}')">${c.name}</button>`
            ).join('');

            sec.innerHTML = `
                <div class="gen-title">${gen.title}</div>
                <div class="console-list">${buttonsHtml}</div>
            `;
            container.appendChild(sec);
        });
    }

    function selectConsole(consoleId, consoleName) {
        currentConsole = consoleId;
        currentLetter = 'all';
        document.getElementById('homePage').style.display = 'none';
        document.getElementById('reviewPage').style.display = 'block';
        document.getElementById('selectedConsoleTitle').innerText = `Reviews for ${consoleName}`;
        
        initAlphabet();
        renderGames();
    }

    function goHome() {
        document.getElementById('homePage').style.display = 'block';
        document.getElementById('reviewPage').style.display = 'none';
    }

    function initAlphabet() {
        const container = document.getElementById('alphabetButtons');
        let html = `<button class="alpha-btn" onclick="filterLetter('all')">ALL</button>`;
        for (let i = 65; i <= 90; i++) {
            const letter = String.fromCharCode(i);
            html += `<button class="alpha-btn" onclick="filterLetter('${letter}')">${letter}</button>`;
        }
        container.innerHTML = html;
    }

    function filterLetter(letter) {
        currentLetter = letter;
        renderGames();
    }

    function renderGames() {
        const list = document.getElementById('gameList');
        list.innerHTML = '';

        const filtered = games.filter(game => {
            const matchConsole = game.consoleId === currentConsole;
            const firstLetter = game.name.charAt(0).toUpperCase();
            const matchLetter = (currentLetter === 'all') || (firstLetter === currentLetter);
            return matchConsole && matchLetter;
        });

        if (filtered.length === 0) {
            list.innerHTML = `<p style="grid-column: 1/-1; color: #64748b; text-align:center; padding: 40px 0;">ยังไม่มีรีวิวเกมในหมวดนี้</p>`;
            return;
        }

        filtered.sort((a, b) => a.name.localeCompare(b.name));

        filtered.forEach(game => {
            const card = document.createElement('div');
            card.className = 'game-card';
            card.innerHTML = `
                <h3>${game.name}</h3>
                <p>${game.review}</p>
            `;
            list.appendChild(card);
        });
    }

    initGenerations();
</script>

</body>
</html>
